  <script type="text/babel">
    const FM = window.Motion || window.framerMotion;
    const { motion, AnimatePresence, useMotionValue, useSpring, useTransform } = FM;
    const MotionConfig = FM.MotionConfig || (({ children }) => children);
    const EASE = [0.16, 1, 0.3, 1];

    /* ---------- Scroll Progress ---------- */
    function ScrollProgress() {
      const { scrollYProgress } = FM.useScroll();
      const scaleX = useSpring(scrollYProgress, { stiffness: 400, damping: 30, restDelta: 0.001 });

      return (
        <motion.div
          style={{ scaleX, transformOrigin: "left" }}
          className="fixed top-0 left-0 right-0 h-[3px] bg-neon z-[99999] pointer-events-none shadow-[0_0_14px_rgba(241,171,1,0.7)]"
        />
      );
    }

    /* ---------- Scroll Reveal ---------- */
    function Reveal({ children, className = "", delay = 0, y = 20, as = "div" }) {
      const Tag = motion[as] || motion.div;
      return (
        <Tag
          className={className}
          initial={{ opacity: 0, y }}
          whileInView={{ opacity: 1, y: 0 }}
          viewport={{ once: true, amount: 0.15 }}
          transition={{ duration: 0.6, ease: EASE, delay: delay / 1000 }}
        >
          {children}
        </Tag>
      );
    }

    /* ---------- Interactive Background ---------- */
    function InteractiveBackground() {
      const mouseX = useMotionValue(-1000);
      const mouseY = useMotionValue(-1000);
      const mouseX2 = useMotionValue(-1000);
      const mouseY2 = useMotionValue(-1000);

      const sx = useSpring(mouseX, { stiffness: 120, damping: 20, mass: 0.5 });
      const sy = useSpring(mouseY, { stiffness: 120, damping: 20, mass: 0.5 });
      const sx2 = useSpring(mouseX2, { stiffness: 80, damping: 22, mass: 0.6 });
      const sy2 = useSpring(mouseY2, { stiffness: 80, damping: 22, mass: 0.6 });

      React.useEffect(() => {
        let rafId = null;
        const move = (e) => {
          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(() => {
            mouseX.set(e.clientX);
            mouseY.set(e.clientY);
            mouseX2.set(window.innerWidth - e.clientX);
            mouseY2.set(window.innerHeight - e.clientY);
          });
        };

        if (window.matchMedia("(pointer: fine)").matches) {
          window.addEventListener("mousemove", move, { passive: true });
        }

        return () => {
          if (rafId) cancelAnimationFrame(rafId);
          window.removeEventListener("mousemove", move);
        };
      }, [mouseX, mouseY, mouseX2, mouseY2]);

      const glow1 = useTransform(
        [sx, sy],
        ([x, y]) => `radial-gradient(650px circle at ${x}px ${y}px, rgba(241, 171, 1, 0.22), transparent 65%)`
      );

      const glow2 = useTransform(
        [sx2, sy2],
        ([x, y]) => `radial-gradient(500px circle at ${x}px ${y}px, rgba(255, 255, 255, 0.05), transparent 60%)`
      );

      return (
        <div aria-hidden="true" style={{ position: "fixed", inset: 0, zIndex: -1, pointerEvents: "none", overflow: "hidden" }}>
          <motion.div style={{ position: "absolute", inset: 0, background: glow1, willChange: "background" }} />
          <motion.div style={{ position: "absolute", inset: 0, background: glow2, willChange: "background" }} />
          <div className="absolute inset-0 bg-grid-pattern opacity-60" />
          <div className="absolute inset-0 overflow-hidden opacity-30">
            <div className="absolute top-[20%] left-[15%] w-1.5 h-1.5 rounded-full bg-neon animate-ping duration-1000" />
            <div className="absolute top-[60%] left-[80%] w-1 h-1 rounded-full bg-white animate-pulse" />
            <div className="absolute top-[75%] left-[25%] w-1.5 h-1.5 rounded-full bg-neon/80 animate-pulse" />
          </div>
          <svg className="fixed inset-0 w-full h-full pointer-events-none opacity-[0.03] z-0 mix-blend-overlay">
            <filter id="noiseFilter">
              <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
            </filter>
            <rect width="100%" height="100%" filter="url(#noiseFilter)" />
          </svg>
        </div>
      );
    }

    /* ---------- Custom Cursor ---------- */
    function CustomCursor() {
      const [enabled, setEnabled] = React.useState(false);
      const [hovering, setHovering] = React.useState(false);
      const x = useMotionValue(-100);
      const y = useMotionValue(-100);
      const sx = useSpring(x, { stiffness: 1000, damping: 40, mass: 0.12 });
      const sy = useSpring(y, { stiffness: 1000, damping: 40, mass: 0.12 });
      const enabledRef = React.useRef(false);

      React.useEffect(() => {
        if (window.matchMedia("(pointer: coarse)").matches || "ontouchstart" in window) return;

        let rafId = null;
        const move = (e) => {
          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(() => {
            x.set(e.clientX);
            y.set(e.clientY);
            if (!enabledRef.current) {
              enabledRef.current = true;
              setEnabled(true);
              document.body.classList.add("has-custom-cursor");
            }
          });
        };

        const isInteractive = (el) => {
          if (!el || !el.closest) return false;
          return Boolean(el.closest("a, button, [role='button'], input, select, textarea, .btn-hard"));
        };

        const over = (e) => { if (isInteractive(e.target)) setHovering(true); };
        const out = (e) => { if (isInteractive(e.target)) setHovering(false); };

        window.addEventListener("mousemove", move, { passive: true });
        document.addEventListener("mouseover", over, { passive: true });
        document.addEventListener("mouseout", out, { passive: true });

        return () => {
          if (rafId) cancelAnimationFrame(rafId);
          window.removeEventListener("mousemove", move);
          document.removeEventListener("mouseover", over);
          document.removeEventListener("mouseout", out);
          document.body.classList.remove("has-custom-cursor");
        };
      }, [x, y]);

      if (!enabled) return null;

      return (
        <motion.div
          aria-hidden="true"
          style={{
            position: "fixed",
            top: 0,
            left: 0,
            x: sx,
            y: sy,
            zIndex: 9999,
            pointerEvents: "none",
            willChange: "transform",
          }}
        >
          <motion.div
            style={{ transform: "translate(-50%, -50%)", borderColor: "#f1ab01" }}
            animate={{
              opacity: enabled ? 1 : 0,
              width: hovering ? 46 : 16,
              height: hovering ? 46 : 16,
              backgroundColor: hovering ? "rgba(241,171,1,0)" : "#f1ab01",
              borderWidth: hovering ? 1.5 : 0,
            }}
            transition={{ duration: 0.2, ease: EASE }}
            className="rounded-full border"
          />
        </motion.div>
      );
    }

    /* ---------- Navigation Header Component ---------- */
    function Header({ current = "cli" }) {
      const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);

      const navLinks = [
        { label: "Home", href: "./index.html", key: "home" },
        { label: "Web Converter", href: "./converter.html", key: "converter" },
        { label: "Download", href: "./download.html", key: "download" },
        { label: "How It Works", href: "./docs.html", key: "docs" },
        { label: "Formats", href: "./formats.html", key: "formats" },
        { label: "Right-Click Menu", href: "./context-menu.html", key: "menu" },
        { label: "CLI", href: "./cli.html", key: "cli" },
        { label: "FAQ", href: "./faq.html", key: "faq" },
      ];

      return (
        <header className="fixed top-0 left-0 w-full z-50 bg-black/85 backdrop-blur-md border-b border-white/10 px-6 md:px-10 py-4 transition-all">
          <div className="max-w-[1400px] mx-auto flex items-center justify-between">
            <a href="./index.html" className="flex items-center gap-3 group" aria-label="AVI Core Home">
              <img src="./logo.webp" alt="AVI Core Logo" width="36" height="36" className="object-contain transition-transform group-hover:scale-105" />
              <div className="flex flex-col text-left">
                <span className="font-display font-bold text-sm tracking-wider text-white group-hover:text-neon transition-colors">AVI CORE</span>
                <span className="font-mono-x text-[9px] text-white/50 tracking-widest">OFFLINE ENGINE</span>
              </div>
            </a>

            {/* Desktop Navigation */}
            <nav className="hidden lg:flex items-center gap-6 font-mono-x text-xs tracking-wider">
              {navLinks.map((link) => {
                const isActive = current === link.key;
                return (
                  <a
                    key={link.key}
                    href={link.href}
                    className={`transition-colors py-1 ${
                      isActive ? "text-neon font-bold" : "text-white/70 hover:text-white"
                    }`}
                  >
                    {link.label}
                  </a>
                );
              })}
            </nav>

            {/* Actions */}
            <div className="hidden sm:flex items-center gap-4">
              <a
                href="https://github.com/Sahil524/AVI-Core"
                target="_blank"
                rel="noopener noreferrer"
                className="font-mono-x text-xs text-white/70 hover:text-neon flex items-center gap-1.5 transition-colors border border-white/15 px-3 py-1.5"
              >
                <span>GitHub</span>
                <span className="text-[10px] text-white/40">↗</span>
              </a>
              <a
                href="./download.html"
                className="btn-hard px-4 py-1.5 font-mono-x text-xs tracking-wider uppercase text-neon border-neon/50 hover:border-neon"
              >
                Download App
              </a>
            </div>

            {/* Mobile Hamburger */}
            <button
              onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
              className="lg:hidden text-white/80 hover:text-neon p-2 focus:outline-none"
              aria-label="Toggle Navigation Menu"
              aria-expanded={mobileMenuOpen}
              aria-controls="mobile-nav-menu"
            >
              <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2">
                {mobileMenuOpen ? (
                  <path d="M6 18L18 6M6 6l12 12" />
                ) : (
                  <path d="M4 6h16M4 12h16M4 18h16" />
                )}
              </svg>
            </button>
          </div>

          {/* Mobile Menu Dropdown */}
          <AnimatePresence>
            {mobileMenuOpen && (
              <motion.div
                id="mobile-nav-menu"
                initial={{ opacity: 0, height: 0 }}
                animate={{ opacity: 1, height: "auto" }}
                exit={{ opacity: 0, height: 0 }}
                className="lg:hidden border-t border-white/10 mt-3 pt-4 pb-4 flex flex-col gap-3 font-mono-x text-sm"
              >
                {navLinks.map((link) => (
                  <a
                    key={link.key}
                    href={link.href}
                    onClick={() => setMobileMenuOpen(false)}
                    className={`py-1.5 px-2 ${current === link.key ? "text-neon font-bold bg-white/5" : "text-white/70"}`}
                  >
                    {link.label}
                  </a>
                ))}
              </motion.div>
            )}
          </AnimatePresence>
        </header>
      );
    }

    /* ---------- Interactive CLI Command Generator ---------- */
    function CommandGenerator() {
      const [type, setType] = React.useState("video");
      const [file, setFile] = React.useState("movie.mkv");
      const [output, setOutput] = React.useState("mp4");
      const [fast, setFast] = React.useState(true);
      const [copied, setCopied] = React.useState(false);

      let commandText = "";
      if (type === "video") {
        commandText = `avicore video convert "${file}" ${output}${fast ? " --fast" : ""}`;
      } else if (type === "audio") {
        commandText = `avicore audio extract "${file}" --format ${output}`;
      } else if (type === "image-single") {
        commandText = `avicore image convert "${file}" ${output}`;
      } else {
        commandText = `avicore image convert "${file}" ${output}`;
      }

      const copyToClipboard = () => {
        navigator.clipboard.writeText(commandText);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="border border-white/10 bg-[#0A0A0A] p-6 md:p-8 space-y-6">
          <div className="flex items-center gap-2 border-b border-white/10 pb-4">
            <span className="w-2.5 h-2.5 rounded-full bg-neon animate-pulse" />
            <span className="font-mono-x text-xs tracking-widest text-white/70 uppercase">Interactive Command Generator</span>
          </div>

          <div className="flex flex-wrap gap-2">
            <button
              onClick={() => { setType("video"); setFile("movie.mkv"); setOutput("mp4"); }}
              className={`font-mono-x text-xs px-3 py-1.5 uppercase border transition-all ${
                type === "video"
                  ? "border-neon bg-neon/15 text-neon font-bold shadow-[0_0_12px_rgba(241,171,1,0.25)]"
                  : "border-white/15 text-white/70 hover:border-white/40"
              }`}
            >
              Convert Video
            </button>
            <button
              onClick={() => { setType("audio"); setFile("lecture.mp4"); setOutput("mp3"); }}
              className={`font-mono-x text-xs px-3 py-1.5 uppercase border transition-all ${
                type === "audio"
                  ? "border-neon bg-neon/15 text-neon font-bold shadow-[0_0_12px_rgba(241,171,1,0.25)]"
                  : "border-white/15 text-white/70 hover:border-white/40"
              }`}
            >
              Extract Audio Track
            </button>
            <button
              onClick={() => { setType("image-single"); setFile("photo.png"); setOutput("webp"); }}
              className={`font-mono-x text-xs px-3 py-1.5 uppercase border transition-all ${
                type === "image-single"
                  ? "border-neon bg-neon/15 text-neon font-bold shadow-[0_0_12px_rgba(241,171,1,0.25)]"
                  : "border-white/15 text-white/70 hover:border-white/40"
              }`}
            >
              Convert Single Image
            </button>
            <button
              onClick={() => { setType("image-batch"); setFile("*.png"); setOutput("webp"); }}
              className={`font-mono-x text-xs px-3 py-1.5 uppercase border transition-all ${
                type === "image-batch"
                  ? "border-neon bg-neon/15 text-neon font-bold shadow-[0_0_12px_rgba(241,171,1,0.25)]"
                  : "border-white/15 text-white/70 hover:border-white/40"
              }`}
            >
              Batch Convert Images
            </button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 font-mono-x text-xs">
            <div>
              <label htmlFor="cli-input-file" className="text-white/70 block text-[10px] uppercase mb-1">Input File / Pattern:</label>
              <input
                id="cli-input-file"
                name="cli-input-file"
                aria-label="Input File or Pattern"
                type="text"
                value={file}
                onChange={(e) => setFile(e.target.value)}
                className="w-full bg-black border border-white/20 p-2 text-white focus:border-neon focus:outline-none"
              />
            </div>
            <div>
              <label htmlFor="cli-target-format" className="text-white/70 block text-[10px] uppercase mb-1">Target Format:</label>
              <input
                id="cli-target-format"
                name="cli-target-format"
                aria-label="Target Format"
                type="text"
                value={output}
                onChange={(e) => setOutput(e.target.value)}
                className="w-full bg-black border border-white/20 p-2 text-white focus:border-neon focus:outline-none uppercase"
              />
            </div>
          </div>

          {type === "video" && (
            <label htmlFor="cli-fast-toggle" className="flex items-center gap-2 font-mono-x text-xs text-white/80 cursor-pointer">
              <input
                id="cli-fast-toggle"
                name="cli-fast-toggle"
                aria-label="Enable fast convert stream copy"
                type="checkbox"
                checked={fast}
                onChange={(e) => setFast(e.target.checked)}
                className="accent-[#f1ab01]"
              />
              <span>--fast (Fast Convert: 1-second lossless stream copy)</span>
            </label>
          )}

          {/* Result command block */}
          <div className="bg-black border border-white/15 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 font-mono-x text-sm">
            <div className="text-neon select-all overflow-x-auto">
              <span className="text-white/40">$ </span>{commandText}
            </div>
            <button
              onClick={copyToClipboard}
              className="btn-hard px-4 py-1.5 text-xs text-neon border-neon/40 hover:border-neon uppercase tracking-wider shrink-0"
