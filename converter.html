    const FM = window.Motion || window.framerMotion;
    const { motion, AnimatePresence, useMotionValue, useSpring, useTransform } = FM;
    const MotionConfig = FM.MotionConfig || (({ children }) => children);
    const EASE = [0.16, 1, 0.3, 1];

    /* ---------- Scroll Progress Indicator ---------- */
    function ScrollProgress() {
      const { scrollYProgress } = FM.useScroll();
      const scaleX = useSpring(scrollYProgress, { stiffness: 400, damping: 30, restDelta: 0.001 });

      return (
        <motion.div
          style={{ scaleX, transformOrigin: "left" }}
          className="fixed top-0 left-0 right-0 h-[3px] bg-neon z-[99999] pointer-events-none shadow-[0_0_14px_rgba(241,171,1,0.7)]"
        />
      );
    }

    /* ---------- Shared Scroll-linked Reveal ---------- */
    function Reveal({ children, className = "", delay = 0, y = 20, as = "div" }) {
      const Tag = motion[as] || motion.div;
      return (
        <Tag
          className={className}
          initial={{ opacity: 0, y }}
          whileInView={{ opacity: 1, y: 0 }}
          viewport={{ once: true, amount: 0.15 }}
          transition={{ duration: 0.6, ease: EASE, delay: delay / 1000 }}
        >
          {children}
        </Tag>
      );
    }

    /* ---------- Shared Interactive Background ---------- */
    function InteractiveBackground() {
      const mouseX = useMotionValue(-1000);
      const mouseY = useMotionValue(-1000);
      const mouseX2 = useMotionValue(-1000);
      const mouseY2 = useMotionValue(-1000);

      const sx = useSpring(mouseX, { stiffness: 120, damping: 20, mass: 0.5 });
      const sy = useSpring(mouseY, { stiffness: 120, damping: 20, mass: 0.5 });
      const sx2 = useSpring(mouseX2, { stiffness: 80, damping: 22, mass: 0.6 });
      const sy2 = useSpring(mouseY2, { stiffness: 80, damping: 22, mass: 0.6 });

      React.useEffect(() => {
        let rafId = null;
        const move = (e) => {
          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(() => {
            mouseX.set(e.clientX);
            mouseY.set(e.clientY);
            mouseX2.set(window.innerWidth - e.clientX);
            mouseY2.set(window.innerHeight - e.clientY);
          });
        };

        if (window.matchMedia("(pointer: fine)").matches) {
          window.addEventListener("mousemove", move, { passive: true });
        }

        return () => {
          if (rafId) cancelAnimationFrame(rafId);
          window.removeEventListener("mousemove", move);
        };
      }, [mouseX, mouseY, mouseX2, mouseY2]);

      const glow1 = useTransform(
        [sx, sy],
        ([x, y]) => `radial-gradient(650px circle at ${x}px ${y}px, rgba(241, 171, 1, 0.22), transparent 65%)`
      );

      const glow2 = useTransform(
        [sx2, sy2],
        ([x, y]) => `radial-gradient(500px circle at ${x}px ${y}px, rgba(255, 255, 255, 0.05), transparent 60%)`
      );

      return (
        <div aria-hidden="true" style={{ position: "fixed", inset: 0, zIndex: -1, pointerEvents: "none", overflow: "hidden" }}>
          <motion.div style={{ position: "absolute", inset: 0, background: glow1, willChange: "background" }} />
          <motion.div style={{ position: "absolute", inset: 0, background: glow2, willChange: "background" }} />
          <div className="absolute inset-0 bg-grid-pattern opacity-60" />
          <div className="absolute inset-0 overflow-hidden opacity-30">
            <div className="absolute top-[20%] left-[15%] w-1.5 h-1.5 rounded-full bg-neon animate-ping duration-1000" />
            <div className="absolute top-[60%] left-[80%] w-1 h-1 rounded-full bg-white animate-pulse" />
            <div className="absolute top-[75%] left-[25%] w-1.5 h-1.5 rounded-full bg-neon/80 animate-pulse" />
          </div>
          <svg className="fixed inset-0 w-full h-full pointer-events-none opacity-[0.03] z-0 mix-blend-overlay">
            <filter id="noiseFilter">
              <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
            </filter>
            <rect width="100%" height="100%" filter="url(#noiseFilter)" />
          </svg>
        </div>
      );
    }

    /* ---------- Shared Custom Cursor ---------- */
    function CustomCursor() {
      const [enabled, setEnabled] = React.useState(false);
      const [hovering, setHovering] = React.useState(false);
      const x = useMotionValue(-100);
      const y = useMotionValue(-100);
      const sx = useSpring(x, { stiffness: 1000, damping: 40, mass: 0.12 });
      const sy = useSpring(y, { stiffness: 1000, damping: 40, mass: 0.12 });
      const enabledRef = React.useRef(false);

      React.useEffect(() => {
        if (window.matchMedia("(pointer: coarse)").matches || "ontouchstart" in window) return;

        let rafId = null;
        const move = (e) => {
          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(() => {
            x.set(e.clientX);
            y.set(e.clientY);
            if (!enabledRef.current) {
              enabledRef.current = true;
              setEnabled(true);
              document.body.classList.add("has-custom-cursor");
            }
          });
        };

        const isInteractive = (el) => {
          if (!el || !el.closest) return false;
          return Boolean(el.closest("a, button, [role='button'], input, select, textarea, .btn-hard"));
        };

        const over = (e) => { if (isInteractive(e.target)) setHovering(true); };
        const out = (e) => { if (isInteractive(e.target)) setHovering(false); };

        window.addEventListener("mousemove", move, { passive: true });
        document.addEventListener("mouseover", over, { passive: true });
        document.addEventListener("mouseout", out, { passive: true });

        return () => {
          if (rafId) cancelAnimationFrame(rafId);
          window.removeEventListener("mousemove", move);
          document.removeEventListener("mouseover", over);
          document.removeEventListener("mouseout", out);
          document.body.classList.remove("has-custom-cursor");
        };
      }, [x, y]);

      if (!enabled) return null;

      return (
        <motion.div
          aria-hidden="true"
          style={{
            position: "fixed",
            top: 0,
            left: 0,
            x: sx,
            y: sy,
            zIndex: 9999,
            pointerEvents: "none",
            willChange: "transform",
          }}
        >
          <motion.div
            style={{ transform: "translate(-50%, -50%)", borderColor: "#f1ab01" }}
            animate={{
              opacity: enabled ? 1 : 0,
              width: hovering ? 46 : 16,
              height: hovering ? 46 : 16,
              backgroundColor: hovering ? "rgba(241,171,1,0)" : "#f1ab01",
              borderWidth: hovering ? 1.5 : 0,
            }}
            transition={{ duration: 0.2, ease: EASE }}
            className="rounded-full border"
          />
        </motion.div>
      );
    }

    /* ---------- Helper: Format bytes to human readable string ---------- */
    function formatBytes(bytes) {
      if (bytes === 0) return "0 Bytes";
      const k = 1024;
      const sizes = ["Bytes", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
    }

    /* ---------- In-Browser Conversion Worker & Processor ---------- */
    // Converts files purely client-side using browser APIs
    async function processFileInBrowser(file, targetFormat, quality) {
      const type = file.type;
      const name = file.name;
      const baseName = name.substring(0, name.lastIndexOf('.')) || name;

      // 1. Image Conversion
      if (type.startsWith("image/") || /\.(png|jpe?g|webp|bmp|gif|svg)$/i.test(name)) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          const reader = new FileReader();

          reader.onload = (e) => {
            img.onload = () => {
              try {
                const canvas = document.createElement("canvas");
                canvas.width = img.naturalWidth || img.width;
                canvas.height = img.naturalHeight || img.height;
                const ctx = canvas.getContext("2d");

                // If converting to JPEG, matte on white to handle alpha transparency cleanly
                if (targetFormat === "jpg" || targetFormat === "jpeg") {
                  ctx.fillStyle = "#FFFFFF";
                  ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                ctx.drawImage(img, 0, 0);

                let mime = "image/webp";
                if (targetFormat === "png") mime = "image/png";
                if (targetFormat === "jpg" || targetFormat === "jpeg") mime = "image/jpeg";

                canvas.toBlob(
                  (blob) => {
                    if (!blob) {
                      reject(new Error("Browser failed to encode image format."));
                      return;
                    }
                    const outputName = `${baseName}.${targetFormat}`;
                    resolve({
                      blob,
                      outputName,
                      size: blob.size,
                    });
                  },
                  mime,
                  quality / 100
                );
              } catch (err) {
                reject(err);
              }
            };
            img.onerror = () => reject(new Error("Could not decode image data."));
            img.src = e.target.result;
          };
          reader.onerror = () => reject(new Error("Failed to read file."));
          reader.readAsDataURL(file);
        });
      }

      // 2. Audio Extraction / Conversion
      if (type.startsWith("audio/") || type.startsWith("video/") || /\.(mp3|wav|ogg|aac|m4a|mp4|webm|mkv|mov)$/i.test(name)) {
        if (targetFormat === "wav") {
          return new Promise(async (resolve, reject) => {
            try {
              const arrayBuffer = await file.arrayBuffer();
              const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

              // Encode to 16-bit PCM WAV
              const wavBlob = audioBufferToWav(audioBuffer);
              const outputName = `${baseName}.wav`;
              resolve({
                blob: wavBlob,
                outputName,
                size: wavBlob.size,
              });
            } catch (err) {
              reject(new Error("Unable to decode audio in this file format."));
            }
          });
        }
      }

      throw new Error(`Format '${targetFormat.toUpperCase()}' not supported in browser converter.`);
    }

    // Convert AudioBuffer to WAV Blob
    function audioBufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      const channels = [];
      let sampleRate = buffer.sampleRate;
      let offset = 0;
      let pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      // RIFF identifier
      setUint32(0x46464952); // "RIFF"
      setUint32(length - 8);  // file length - 8
      setUint32(0x45564157); // "WAVE"
      setUint32(0x20746d66); // "fmt " chunk
      setUint32(16);         // length = 16
      setUint16(1);          // PCM (uncompressed)
      setUint16(numOfChan);
      setUint32(sampleRate);
      setUint32(sampleRate * 2 * numOfChan); // avg. bytes/sec
      setUint16(numOfChan * 2);              // block-align
      setUint16(16);                         // 16-bit
      setUint32(0x61746164); // "data" - chunk
      setUint32(length - pos - 4); // chunk length

      for (let i = 0; i < buffer.numberOfChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          let sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return new Blob([out.buffer], { type: "audio/wav" });
    }

    /* ---------- Interactive Web Converter App Component ---------- */
    function WebConverter() {
      const [queue, setQueue] = React.useState([]);
      const [isDragging, setIsDragging] = React.useState(false);
      const [targetFormat, setTargetFormat] = React.useState("webp");
      const [quality, setQuality] = React.useState(85);
      const [isConverting, setIsConverting] = React.useState(false);
      const fileInputRef = React.useRef(null);

      // Add files to queue
      const addFiles = (fileList) => {
        const newItems = Array.from(fileList).map((f) => ({
          id: Math.random().toString(36).substring(2, 9),
          file: f,
          name: f.name,
          size: f.size,
          type: f.type,
          status: "waiting", // waiting, converting, completed, failed
          progress: 0,
          resultBlob: null,
          resultName: null,
          resultSize: 0,
          error: null,
        }));
        setQueue((prev) => [...prev, ...newItems]);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer && e.dataTransfer.files) {
          addFiles(e.dataTransfer.files);
        }
      };

      // Process Queue with concurrency limit
      const startConversion = async () => {
        if (isConverting || queue.length === 0) return;
        setIsConverting(true);

        const itemsToProcess = queue.filter((item) => item.status === "waiting" || item.status === "failed");

        for (const item of itemsToProcess) {
          setQueue((prev) =>
            prev.map((q) => (q.id === item.id ? { ...q, status: "converting", progress: 20 } : q))
          );

          try {
            // Processing step
            const result = await processFileInBrowser(item.file, targetFormat, quality);

            setQueue((prev) =>
              prev.map((q) =>
                q.id === item.id
                  ? {
                      ...q,
                      status: "completed",
                      progress: 100,
                      resultBlob: result.blob,
                      resultName: result.outputName,
                      resultSize: result.size,
                    }
                  : q
              )
            );
          } catch (err) {
            setQueue((prev) =>
              prev.map((q) =>
                q.id === item.id
                  ? {
                      ...q,
                      status: "failed",
                      progress: 0,
                      error: err.message || "Failed to convert file.",
                    }
                  : q
              )
            );
          }
        }

        setIsConverting(false);
      };

      // Download single file
      const downloadFile = (item) => {
        if (!item.resultBlob) return;
        const url = URL.createObjectURL(item.resultBlob);
        const a = document.createElement("a");
        a.href = url;
        a.download = item.resultName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      // Download all as ZIP
      const downloadAllZip = async () => {
        const completed = queue.filter((q) => q.status === "completed" && q.resultBlob);
        if (completed.length === 0 || !window.JSZip) return;

        const zip = new window.JSZip();
        completed.forEach((item) => {
          zip.file(item.resultName, item.resultBlob);
        });

        const content = await zip.generateAsync({ type: "blob" });
        const url = URL.createObjectURL(content);
        const a = document.createElement("a");
        a.href = url;
        a.download = `AVI-Core-Batch-${new Date().toISOString().slice(0, 10)}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const clearQueue = () => {
        setQueue([]);
      };

      const completedCount = queue.filter((q) => q.status === "completed").length;
      const failedCount = queue.filter((q) => q.status === "failed").length;

      return (
        <div className="space-y-10">
          {/* Privacy Guarantee Banner */}
          <div className="border border-neon/40 bg-[#0A0A0A] p-4 flex flex-col sm:flex-row items-center justify-between gap-4 font-mono-x text-xs">
            <div className="flex items-center gap-3">
              <span className="text-xl">🔒</span>
              <div>
                <span className="text-neon font-bold block">100% In-Browser Private Conversion</span>
                <span className="text-white/70 text-[11px]">
                  Your files are processed directly on your device. They are NEVER uploaded to any server.
                </span>
              </div>
            </div>
            <div className="text-[10px] text-white/50 bg-black/60 px-3 py-1.5 border border-white/10 uppercase tracking-widest whitespace-nowrap">
              Zero Server Uploads
            </div>
          </div>

          {/* Drag & Drop Area */}
          <div
            tabIndex={0}
            role="button"
            aria-label="Drag and drop media files or click to choose files"
            onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
            onDragLeave={() => setIsDragging(false)}
            onDrop={handleDrop}
            onClick={() => fileInputRef.current && fileInputRef.current.click()}
            onKeyDown={(e) => {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                fileInputRef.current && fileInputRef.current.click();
              }
            }}
            className={`border-2 border-dashed p-10 md:p-14 text-center cursor-pointer transition-all duration-300 relative select-none ${
              isDragging
                ? "border-neon bg-neon/10 shadow-[0_0_30px_rgba(241,171,1,0.25)]"
                : "border-white/20 bg-[#0A0A0A] hover:border-neon/60 focus-visible:border-neon"
            }`}
          >
            <input
              id="file-upload-input"
              name="file-upload-input"
              aria-label="Upload files for conversion"
              type="file"
              ref={fileInputRef}
              multiple
              onChange={(e) => { if (e.target.files) addFiles(e.target.files); }}
              className="hidden"
            />
            <div className="flex flex-col items-center gap-3">
              <div className="w-14 h-14 rounded-full border border-white/20 flex items-center justify-center text-neon text-2xl mb-1 bg-black">
                +
              </div>
              <h3 className="font-display font-bold text-xl md:text-2xl text-white">
                Drag & drop your files here
              </h3>
              <p className="text-white/60 text-sm max-w-md">
                Select 1 file or a hundred files. Supports PNG, JPG, WebP, BMP, and audio/video files.
              </p>
              <button
                type="button"
                className="mt-3 btn-hard px-6 py-2.5 font-mono-x text-xs uppercase tracking-wider text-neon border-neon/50 hover:border-neon"
              >
                Choose Files From Device
              </button>
            </div>
          </div>

          {/* Conversion Controls */}
          {queue.length > 0 && (
            <div className="border border-white/10 bg-[#0A0A0A] p-6 space-y-6 font-mono-x text-xs">
              <div className="flex flex-wrap items-center justify-between gap-4 border-b border-white/10 pb-4">
                <div className="flex items-center gap-3">
                  <span className="text-white/50 uppercase">Convert All To:</span>
                  <div className="flex flex-wrap gap-2">
                    {["webp", "png", "jpg", "wav"].map((fmt) => (
                      <button
                        key={fmt}
                        onClick={() => setTargetFormat(fmt)}
                        className={`px-3 py-1.5 uppercase border transition-all ${
                          targetFormat === fmt
                            ? "border-neon bg-neon/15 text-neon font-bold shadow-[0_0_12px_rgba(241,171,1,0.25)]"
                            : "border-white/15 text-white/70 hover:border-white/40"
                        }`}
                      >
                        .{fmt}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Quality Slider for Images */}
                {(targetFormat === "webp" || targetFormat === "jpg") && (
                  <div className="flex items-center gap-3">
                    <label htmlFor="image-quality-slider" className="text-white/50 uppercase cursor-pointer">Quality:</label>
                    <input
                      id="image-quality-slider"
                      name="image-quality-slider"
                      aria-label="Image compression quality percentage"
                      type="range"
                      min="40"
                      max="100"
                      value={quality}
                      onChange={(e) => setQuality(Number(e.target.value))}
                      className="accent-[#f1ab01] w-24 cursor-pointer"
                    />
                    <span className="text-neon font-bold">{quality}%</span>
                  </div>
                )}
              </div>

              {/* Action Buttons */}
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <button
                    onClick={startConversion}
                    disabled={isConverting}
                    style={{ backgroundColor: "var(--neon)", color: "#000000" }}
                    className="px-6 py-3 font-bold uppercase tracking-wider hover:bg-white hover:text-black transition-all disabled:opacity-50 border border-neon shadow-[0_0_20px_rgba(241,171,1,0.3)]"
                  >
                    {isConverting ? "Converting Files..." : `Convert ${queue.length} Files`}
                  </button>
                  <button
                    onClick={clearQueue}
                    disabled={isConverting}
                    className="border border-white/20 px-4 py-3 text-white/70 hover:text-white uppercase tracking-wider text-[11px]"
                  >
                    Clear Queue
                  </button>
                </div>

                {completedCount > 0 && (
                  <button
                    onClick={downloadAllZip}
                    className="btn-hard px-5 py-3 border-neon text-neon font-bold uppercase tracking-wider hover:bg-neon hover:text-black transition-all flex items-center gap-2"
                  >
                    <span>↓ Download All as ZIP</span>
                    <span className="bg-neon/20 px-2 py-0.5 text-[10px] rounded-none">
                      {completedCount} files
                    </span>
                  </button>
                )}
              </div>
            </div>
          )}

          {/* Queue List */}
          {queue.length > 0 && (
            <div className="border border-white/10 bg-[#0A0A0A] overflow-hidden">
              <div className="p-4 bg-black/60 border-b border-white/10 flex items-center justify-between font-mono-x text-xs text-white/60">
                <span>QUEUE ({queue.length} FILES)</span>
                <span>
                  Completed: <strong className="text-neon">{completedCount}</strong> / {queue.length}
                </span>
              </div>

              <div className="divide-y divide-white/5 max-h-[460px] overflow-y-auto">
                {queue.map((item) => (
                  <div key={item.id} className="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 font-mono-x text-xs hover:bg-white/[0.02]">
                    <div className="flex items-center gap-3 min-w-0">
                      <span className="text-lg">
                        {item.type.startsWith("image/") ? "🖼️" : item.type.startsWith("audio/") ? "🎵" : "🎬"}
                      </span>
                      <div className="min-w-0">
                        <div className="text-white font-bold truncate max-w-xs sm:max-w-md">{item.name}</div>
                        <div className="text-white/40 text-[10px]">
                          Original: {formatBytes(item.size)}
                          {item.resultSize > 0 && (
                            <span className="text-emerald-400 ml-2">
                              ➔ Converted: {formatBytes(item.resultSize)} ({Math.round((1 - item.resultSize / item.size) * 100)}% smaller)
                            </span>
                          )}
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center gap-3 shrink-0">
                      {item.status === "waiting" && (
                        <span className="text-white/50 text-[11px] px-2.5 py-1 border border-white/10">Waiting</span>
                      )}
                      {item.status === "converting" && (
                        <span className="text-neon text-[11px] px-2.5 py-1 border border-neon/40 flex items-center gap-1.5 animate-pulse">
                          <span className="w-1.5 h-1.5 rounded-full bg-neon animate-ping" />
                          Processing...
                        </span>
                      )}
                      {item.status === "completed" && (
                        <div className="flex items-center gap-2">
                          <span className="text-emerald-400 text-[11px] px-2.5 py-1 border border-emerald-500/40">✓ Done</span>
                          <button
                            onClick={() => downloadFile(item)}
                            className="btn-hard px-3 py-1 text-neon border-neon/40 hover:border-neon text-[11px]"
                          >
                            Download
                          </button>
                        </div>
                      )}
                      {item.status === "failed" && (
                        <span className="text-rose-400 text-[11px] px-2.5 py-1 border border-rose-500/40" title={item.error}>
                          ✕ Failed
                        </span>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Web vs Desktop Comparison */}
          <div className="pt-12 border-t border-white/10">
            <Reveal>
              <h2 className="font-display font-bold text-2xl md:text-3xl text-center mb-4">
                Two ways to use AVI Core
              </h2>
              <p className="text-white/60 text-center max-w-xl mx-auto mb-10 text-sm">
                Choose the version that fits how you work. Both are 100% private and offline.
              </p>
            </Reveal>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {/* Web Version */}
              <div className="border border-white/10 bg-[#0A0A0A] p-6 md:p-8 space-y-4">
                <div className="font-mono-x text-xs text-neon tracking-widest uppercase">OPTION 1</div>
                <h3 className="font-display font-bold text-xl text-white">AVI Core Web (In-Browser)</h3>
                <p className="text-white/70 text-sm leading-relaxed">
                  Best for quick conversions without installing software. Works in any browser on any device.
                </p>
                <ul className="space-y-2 text-white/70 text-xs font-mono-x">
                  <li className="flex items-center gap-2"><span className="text-neon">✓</span> No software installation required</li>
                  <li className="flex items-center gap-2"><span className="text-neon">✓</span> 100% private — files never leave your browser</li>
                  <li className="flex items-center gap-2"><span className="text-neon">✓</span> Convert single files or large batches</li>
                  <li className="flex items-center gap-2"><span className="text-neon">✓</span> One-click download as ZIP</li>
                </ul>
              </div>

              {/* Desktop Version */}
              <div className="border border-neon/40 bg-[#0A0A0A] p-6 md:p-8 space-y-4 relative shadow-[0_0_30px_rgba(241,171,1,0.1)]">
                <div className="font-mono-x text-xs text-neon tracking-widest uppercase">OPTION 2 • RECOMMENDED FOR WINDOWS</div>
                <h3 className="font-display font-bold text-xl text-white">AVI Core for Windows (Desktop)</h3>
                <p className="text-white/70 text-sm leading-relaxed">
                  Best for heavy daily use, giant video files, and right-click simplicity inside Windows File Explorer.
                </p>
                <ul className="space-y-2 text-white/70 text-xs font-mono-x">
                  <li className="flex items-center gap-2"><span className="text-neon">✓</span> Right-click any file in Windows Explorer</li>
                  <li className="flex items-center gap-2"><span className="text-neon">✓</span> Super-fast GPU acceleration (NVIDIA, Intel, AMD)</li>
                  <li className="flex items-center gap-2"><span className="text-neon">✓</span> Automatic safety backups of original files</li>
                  <li className="flex items-center gap-2"><span className="text-neon">✓</span> Instant 1-second stream copy (MKV to MP4)</li>
                  <li className="flex items-center gap-2"><span className="text-neon">✓</span> Command-line tool (CLI) for scripts</li>
                </ul>
                <div className="pt-2">
                  <a
                    href="./download.html"
                    className="btn-hard inline-block px-5 py-2.5 font-mono-x text-xs uppercase tracking-wider text-neon border-neon/50 hover:border-neon"
                  >
                    Get Windows Desktop App ➔
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ---------- Main Web Converter Page ---------- */
    function ConverterPage() {
      return (
        <div className="relative min-h-screen w-full text-white flex flex-col justify-between pt-24">
          <ScrollProgress />
          <InteractiveBackground />
          <CustomCursor />
          <Header current="converter" />

          {/* Hero Banner */}
          <section className="px-6 md:px-12 max-w-5xl mx-auto pt-8 pb-12 border-b border-white/10 text-center">
            <Reveal>
              <div className="inline-flex items-center gap-2 px-3 py-1 border border-white/15 bg-white/5 font-mono-x text-xs text-neon mb-6">
                <span>IN-BROWSER PRIVATE CONVERSION</span>
              </div>
              <h1 className="font-display font-bold text-3xl sm:text-5xl md:text-6xl tracking-tight leading-none mb-6">
                CONVERT FILES <span className="text-neon">WITHOUT UPLOADING.</span>
              </h1>
              <p className="text-white/70 text-base md:text-lg max-w-2xl mx-auto leading-relaxed">
                AVI Core processes your files directly on your device. Select one file or hundreds of files, choose what you want to convert them to, and let your browser do the rest.
              </p>
            </Reveal>
          </section>

          {/* Main Content Area */}
          <main className="px-6 md:px-12 max-w-5xl mx-auto py-12 flex-1 w-full">
            <WebConverter />
          </main>

          {/* Footer Component */}
          <footer className="border-t border-white/10 py-12 px-6 md:px-12 w-full text-center font-mono-x text-xs text-white/50 space-y-4 mt-auto">
            <div className="max-w-[1400px] mx-auto space-y-4">
              <div className="flex flex-wrap justify-center gap-6 text-white/70">
                <a href="./index.html" className="hover:text-neon">Home</a>
                <a href="./converter.html" className="text-neon font-bold">Web Converter</a>
                <a href="./download.html" className="hover:text-neon">Download</a>
                <a href="./docs.html" className="hover:text-neon">How It Works</a>
                <a href="./formats.html" className="hover:text-neon">Supported Formats</a>
                <a href="./context-menu.html" className="hover:text-neon">Right-Click Menu</a>
                <a href="./cli.html" className="hover:text-neon">CLI</a>
                <a href="./faq.html" className="hover:text-neon">FAQ</a>
                <a href="./llms.txt" className="hover:text-neon">llms.txt</a>
                <a href="./llms-full.txt" className="hover:text-neon">llms-full.txt</a>
                <a href="https://github.com/Sahil524/AVI-Core" target="_blank" rel="noopener noreferrer" className="hover:text-neon">GitHub ↗</a>
              </div>
              <p className="text-[10px] tracking-widest text-white/40">
                AVI CORE &nbsp;•&nbsp; 100% OFFLINE WINDOWS MEDIA ENGINE &nbsp;•&nbsp; MIT OPEN SOURCE
              </p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ConverterPage />);
  </script>
</body>
