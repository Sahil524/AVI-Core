  <script type="text/babel">
    const FM = window.Motion || window.framerMotion;
    const { motion, AnimatePresence, useMotionValue, useSpring, useTransform } = FM;
    const MotionConfig = FM.MotionConfig || (({ children }) => children);
    const EASE = [0.16, 1, 0.3, 1];

    /* ---------- Scroll Progress ---------- */
    function ScrollProgress() {
      const { scrollYProgress } = FM.useScroll();
      const scaleX = useSpring(scrollYProgress, { stiffness: 400, damping: 30, restDelta: 0.001 });

      return (
        <motion.div
          style={{ scaleX, transformOrigin: "left" }}
          className="fixed top-0 left-0 right-0 h-[3px] bg-neon z-[99999] pointer-events-none shadow-[0_0_14px_rgba(241,171,1,0.7)]"
        />
      );
    }

    /* ---------- Scroll Reveal ---------- */
    function Reveal({ children, className = "", delay = 0, y = 20, as = "div" }) {
      const Tag = motion[as] || motion.div;
      return (
        <Tag
          className={className}
          initial={{ opacity: 0, y }}
          whileInView={{ opacity: 1, y: 0 }}
          viewport={{ once: true, amount: 0.15 }}
          transition={{ duration: 0.6, ease: EASE, delay: delay / 1000 }}
        >
          {children}
        </Tag>
      );
    }

    /* ---------- Interactive Background ---------- */
    function InteractiveBackground() {
      const mouseX = useMotionValue(-1000);
      const mouseY = useMotionValue(-1000);
      const mouseX2 = useMotionValue(-1000);
      const mouseY2 = useMotionValue(-1000);

      const sx = useSpring(mouseX, { stiffness: 120, damping: 20, mass: 0.5 });
      const sy = useSpring(mouseY, { stiffness: 120, damping: 20, mass: 0.5 });
      const sx2 = useSpring(mouseX2, { stiffness: 80, damping: 22, mass: 0.6 });
      const sy2 = useSpring(mouseY2, { stiffness: 80, damping: 22, mass: 0.6 });

      React.useEffect(() => {
        let rafId = null;
        const move = (e) => {
          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(() => {
            mouseX.set(e.clientX);
            mouseY.set(e.clientY);
            mouseX2.set(window.innerWidth - e.clientX);
            mouseY2.set(window.innerHeight - e.clientY);
          });
        };

        if (window.matchMedia("(pointer: fine)").matches) {
          window.addEventListener("mousemove", move, { passive: true });
        }

        return () => {
          if (rafId) cancelAnimationFrame(rafId);
          window.removeEventListener("mousemove", move);
        };
      }, [mouseX, mouseY, mouseX2, mouseY2]);

      const glow1 = useTransform(
        [sx, sy],
        ([x, y]) => `radial-gradient(650px circle at ${x}px ${y}px, rgba(241, 171, 1, 0.22), transparent 65%)`
      );

      const glow2 = useTransform(
        [sx2, sy2],
        ([x, y]) => `radial-gradient(500px circle at ${x}px ${y}px, rgba(255, 255, 255, 0.05), transparent 60%)`
      );

      return (
        <div aria-hidden="true" style={{ position: "fixed", inset: 0, zIndex: -1, pointerEvents: "none", overflow: "hidden" }}>
          <motion.div style={{ position: "absolute", inset: 0, background: glow1, willChange: "background" }} />
          <motion.div style={{ position: "absolute", inset: 0, background: glow2, willChange: "background" }} />
          <div className="absolute inset-0 bg-grid-pattern opacity-60" />
          <div className="absolute inset-0 overflow-hidden opacity-30">
            <div className="absolute top-[20%] left-[15%] w-1.5 h-1.5 rounded-full bg-neon animate-ping duration-1000" />
            <div className="absolute top-[60%] left-[80%] w-1 h-1 rounded-full bg-white animate-pulse" />
            <div className="absolute top-[75%] left-[25%] w-1.5 h-1.5 rounded-full bg-neon/80 animate-pulse" />
          </div>
          <svg className="fixed inset-0 w-full h-full pointer-events-none opacity-[0.03] z-0 mix-blend-overlay">
            <filter id="noiseFilter">
              <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
            </filter>
            <rect width="100%" height="100%" filter="url(#noiseFilter)" />
          </svg>
        </div>
      );
    }

    /* ---------- Custom Cursor ---------- */
    function CustomCursor() {
      const [enabled, setEnabled] = React.useState(false);
      const [hovering, setHovering] = React.useState(false);
      const x = useMotionValue(-100);
      const y = useMotionValue(-100);
      const sx = useSpring(x, { stiffness: 1000, damping: 40, mass: 0.12 });
      const sy = useSpring(y, { stiffness: 1000, damping: 40, mass: 0.12 });
      const enabledRef = React.useRef(false);

      React.useEffect(() => {
        if (window.matchMedia("(pointer: coarse)").matches || "ontouchstart" in window) return;

        let rafId = null;
        const move = (e) => {
          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(() => {
            x.set(e.clientX);
            y.set(e.clientY);
            if (!enabledRef.current) {
              enabledRef.current = true;
              setEnabled(true);
              document.body.classList.add("has-custom-cursor");
            }
          });
        };

        const isInteractive = (el) => {
          if (!el || !el.closest) return false;
          return Boolean(el.closest("a, button, [role='button'], input, select, textarea, .btn-hard"));
        };

        const over = (e) => { if (isInteractive(e.target)) setHovering(true); };
        const out = (e) => { if (isInteractive(e.target)) setHovering(false); };

        window.addEventListener("mousemove", move, { passive: true });
        document.addEventListener("mouseover", over, { passive: true });
        document.addEventListener("mouseout", out, { passive: true });

        return () => {
          if (rafId) cancelAnimationFrame(rafId);
          window.removeEventListener("mousemove", move);
          document.removeEventListener("mouseover", over);
          document.removeEventListener("mouseout", out);
          document.body.classList.remove("has-custom-cursor");
        };
      }, [x, y]);

      if (!enabled) return null;

      return (
        <motion.div
          aria-hidden="true"
          style={{
            position: "fixed",
            top: 0,
            left: 0,
            x: sx,
            y: sy,
            zIndex: 9999,
            pointerEvents: "none",
            willChange: "transform",
          }}
        >
          <motion.div
            style={{ transform: "translate(-50%, -50%)", borderColor: "#f1ab01" }}
            animate={{
              opacity: enabled ? 1 : 0,
              width: hovering ? 46 : 16,
              height: hovering ? 46 : 16,
              backgroundColor: hovering ? "rgba(241,171,1,0)" : "#f1ab01",
              borderWidth: hovering ? 1.5 : 0,
            }}
            transition={{ duration: 0.2, ease: EASE }}
            className="rounded-full border"
          />
        </motion.div>
      );
    }
