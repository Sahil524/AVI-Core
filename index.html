  <script type="text/babel">
    const FM = window.Motion || window.framerMotion;
    const { motion, AnimatePresence, useMotionValue, useSpring, useInView, useTransform } = FM;
    const MotionConfig = FM.MotionConfig || (({ children }) => children);

    const EASE = [0.16, 1, 0.3, 1];

    /* ---------- Global Scroll Progress Indicator ---------- */
    function ScrollProgress() {
      const { scrollYProgress } = FM.useScroll();
      const scaleX = useSpring(scrollYProgress, { stiffness: 400, damping: 30, restDelta: 0.001 });

      return (
        <motion.div
          style={{ scaleX, transformOrigin: "left" }}
          className="fixed top-0 left-0 right-0 h-[3px] bg-neon z-[99999] pointer-events-none shadow-[0_0_14px_rgba(241,171,1,0.7)]"
        />
      );
    }

    /* ---------- Step-sequence loop ---------- */
    function useStepLoop(durations, active) {
      const [step, setStep] = React.useState(0);
      React.useEffect(() => {
        if (!active) {
          setStep(0);
          return;
        }
        let cancelled = false;
        let timeoutId = null;
        function run(i) {
          timeoutId = setTimeout(() => {
            if (cancelled) return;
            const next = (i + 1) % durations.length;
            setStep(next);
            run(next);
          }, durations[i]);
        }
        setStep(0);
        run(0);
        return () => {
          cancelled = true;
          if (timeoutId) clearTimeout(timeoutId);
        };
      }, [active, durations]);
      return step;
    }

    /* ---------- Shared scroll-linked reveal ---------- */
    function Reveal({ children, className = "", delay = 0, y = 24, as = "div" }) {
      const Tag = motion[as] || motion.div;
      return (
        <Tag
          className={className}
          initial={{ opacity: 0, y }}
          whileInView={{ opacity: 1, y: 0 }}
          viewport={{ once: false, amount: 0.2 }}
          transition={{ duration: 0.7, ease: EASE, delay: delay / 1000 }}
        >
          {children}
        </Tag>
      );
    }

    /* ---------- Reusable Magnetic Button ---------- */
    function MagneticButton({ children, href, className = "", ariaLabel, target, rel }) {
      const ref = React.useRef(null);
      const x = useMotionValue(0);
      const y = useMotionValue(0);
      const springX = useSpring(x, { stiffness: 180, damping: 14, mass: 0.1 });
      const springY = useSpring(y, { stiffness: 180, damping: 14, mass: 0.1 });

      const handleMouseMove = (e) => {
        if (!ref.current || window.matchMedia("(pointer: coarse)").matches) return;
        const rect = ref.current.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const distanceX = e.clientX - centerX;
        const distanceY = e.clientY - centerY;

        x.set(distanceX * 0.22);
        y.set(distanceY * 0.22);
      };

      const handleMouseLeave = () => {
        x.set(0);
        y.set(0);
      };

      return (
        <motion.a
          ref={ref}
          href={href}
          target={target}
          rel={rel}
          aria-label={ariaLabel}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={{ x: springX, y: springY, willChange: "transform" }}
          whileHover={{ scale: 1.04 }}
          whileTap={{ scale: 0.96 }}
          className={`btn-hard relative inline-block px-9 py-4 font-mono-x text-sm tracking-[0.15em] uppercase select-none ${className}`}
        >
          {children}
        </motion.a>
      );
    }

    /* ---------- Icons ---------- */
    function Logo({ size = 120 }) {
      return (
        <img
          width={size}
          height={size}
          src="./logo.webp"
          alt="AVI Core Logo - Offline Media Converter for Windows"
          loading="lazy"
          decoding="async"
          className="object-contain"
        />
      );
    }

    function FileGlyph({ image = false, size = 44 }) {
      return (
        <svg width={size} height={size * 1.2} viewBox="0 0 40 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img">
          <path d="M4 2H26L36 12V46H4V2Z" stroke="#FFFFFF" strokeWidth="1.4" strokeLinejoin="miter" />
          <path d="M26 2V12H36" stroke="#FFFFFF" strokeWidth="1.4" strokeLinejoin="miter" />
          {image && (
            <g stroke="#f1ab01" strokeWidth="1.3">
              <circle cx="14" cy="26" r="2.6" />
              <path d="M8 38L17 28L23 34L32 24V42H8V38Z" />
            </g>
          )}
        </svg>
      );
    }

    function FolderGlyph({ size = 64 }) {
      return (
        <svg width={size} height={size * 0.78} viewBox="0 0 64 50" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img">
          <path d="M2 8H24L29 14H62V46H2V8Z" stroke="#FFFFFF" strokeWidth="1.6" strokeLinejoin="miter" />
          <path d="M2 8V46" stroke="#FFFFFF" strokeWidth="1.6" />
        </svg>
      );
    }

    function CursorGlyph({ size = 22 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img" className="drop-shadow-[0_4px_12px_rgba(0,0,0,0.8)]">
          <path d="M4 3L20 12L12.5 13.5L10 21L4 3Z" fill="#FFFFFF" stroke="#000000" strokeWidth="1" strokeLinejoin="round" />
        </svg>
      );
    }

    /* ---------- Shared Glass Context Menu ---------- */
    function ContextMenu({ show, selected, clicked, style }) {
      return (
        <AnimatePresence>
          {show && (
            <motion.div
              initial={{ opacity: 0, scale: 0.9, y: -6 }}
              animate={{ opacity: 1, scale: 1, y: 0 }}
              exit={{ opacity: 0, scale: 0.9, y: -6 }}
              transition={{ duration: 0.25, ease: EASE }}
              style={{ position: "absolute", zIndex: 30, ...style }}
              className="w-32 border border-white/15 bg-panel/95 backdrop-blur-md shadow-[0_12px_36px_rgba(0,0,0,0.85)] font-mono-x text-[10px] tracking-wide"
              aria-hidden="true"
            >
              <div className="px-3 py-2 flex items-center justify-between text-white/80 border-b border-white/10">
                <span>AVI CORE</span>
                <motion.span animate={{ x: selected ? [0, 2, 0] : 0 }} transition={{ repeat: Infinity, duration: 1.2 }}>▸</motion.span>
              </div>
              <motion.div
                animate={{
                  backgroundColor: clicked
                    ? "rgba(241,171,1,0.3)"
                    : selected
                      ? "rgba(241,171,1,0.14)"
                      : "rgba(0,0,0,0)",
                  color: selected || clicked ? "#f1ab01" : "rgba(255,255,255,0.6)",
                }}
                transition={{ duration: 0.2 }}
                className="px-3 py-2"
              >
                Convert
              </motion.div>
            </motion.div>
          )}
        </AnimatePresence>
      );
    }

    /* ---------- Bulk Conversion Visual ---------- */
    function BulkConversionVisual() {
      const files = ["photo_1", "photo_2", "photo_3", "photo_4"];
      const ref = React.useRef(null);
      const inView = useInView(ref, { amount: 0.4, once: false });

      const durations = React.useMemo(() => [500, 900, 450, 600, 500, 900, 1100], []);
      const step = useStepLoop(durations, inView);

      const cursorTargets = [
        { left: "-6%", top: "34%", opacity: 0 },
        { left: "80%", top: "34%", opacity: 1 },
        { left: "82%", top: "34%", opacity: 1 },
        { left: "84%", top: "46%", opacity: 1 },
        { left: "84%", top: "58%", opacity: 1 },
        { left: "84%", top: "58%", opacity: 0.3 },
        { left: "84%", top: "58%", opacity: 0 },
      ];
      const cursorTarget = cursorTargets[step];
      const cursorDuration = step === 1 ? 0.9 : 0.35;

      const boxVisible = step >= 1 && step <= 5;
      const menuVisible = step >= 2 && step <= 4;
      const menuSelected = step >= 3;
      const menuClicked = step === 4;
      const converting = step === 5;
      const done = step === 6;
      const filesSelected = step >= 1;

      return (
        <div ref={ref} aria-label="Interactive bulk conversion visual demonstration" className="relative inline-block max-w-full mb-16 md:mb-18 pt-4 pb-6 select-none">
          {/* Windows Selection Outline & Glow */}
          <motion.div
            animate={{ scaleX: boxVisible ? 1 : 0, opacity: boxVisible ? 1 : 0 }}
            transition={{ duration: 0.5, ease: EASE }}
            style={{ transformOrigin: "left", borderColor: "var(--neon)", background: "rgba(241,171,1,0.08)", willChange: "transform, opacity" }}
            className="absolute -inset-x-2 -inset-y-2 border border-dashed pointer-events-none shadow-[0_0_25px_rgba(241,171,1,0.15)]"
          />

          {/* Real-time status pill indicator */}
          <AnimatePresence>
            {converting && (
              <motion.div
                initial={{ opacity: 0, y: -8 }}

    /* ---------- Enhanced CLI Command Execution Simulator ---------- */
    function useTypedTerminal(commands, active) {
      const [lines, setLines] = React.useState([]);

      React.useEffect(() => {
        if (!active) {
          setLines([]);
          return;
        }
        let cancelled = false;
        let timerId = null;

        const wait = (ms) => new Promise((resolve) => {
          timerId = setTimeout(resolve, ms);
        });

        const setLast = (patch) =>
          setLines((prev) => {
            if (!prev.length) return prev;
            const copy = [...prev];
            copy[copy.length - 1] = { ...copy[copy.length - 1], ...patch };
            return copy;
          });

        async function run() {
          while (!cancelled) {
            setLines([]);
            for (const cmd of commands) {
              if (cancelled) return;
              setLines((prev) => [...prev, { cmd, typed: "", stage: 0, status: "typing" }]);
              for (let i = 1; i <= cmd.length; i++) {
                if (cancelled) return;
                await wait(22 + Math.random() * 24);
                if (cancelled) return;
                setLast({ typed: cmd.slice(0, i) });
              }
              await wait(350);
              if (cancelled) return;
              setLast({ status: "running", stage: 1 });
              await wait(300);
              if (cancelled) return;
              setLast({ stage: 2 });
              await wait(400);
              if (cancelled) return;
              setLast({ status: "done", stage: 3 });
              await wait(600);
            }
            if (cancelled) return;
            await wait(1400);
          }
        }
        run();
        return () => {
          cancelled = true;
          if (timerId) clearTimeout(timerId);
        };
      }, [active, commands]);

      return lines;
    }

    /* ---------- Advanced Multi-Layer Interactive Background ---------- */
    function InteractiveBackground() {
      const mouseX = useMotionValue(-1000);
      const mouseY = useMotionValue(-1000);
      const mouseX2 = useMotionValue(-1000);
      const mouseY2 = useMotionValue(-1000);

      const sx = useSpring(mouseX, { stiffness: 120, damping: 20, mass: 0.5 });
      const sy = useSpring(mouseY, { stiffness: 120, damping: 20, mass: 0.5 });
      const sx2 = useSpring(mouseX2, { stiffness: 80, damping: 22, mass: 0.6 });
      const sy2 = useSpring(mouseY2, { stiffness: 80, damping: 22, mass: 0.6 });

      React.useEffect(() => {
        let rafId = null;
        const move = (e) => {
          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(() => {
            mouseX.set(e.clientX);
            mouseY.set(e.clientY);
            mouseX2.set(window.innerWidth - e.clientX);
            mouseY2.set(window.innerHeight - e.clientY);
          });
        };

        if (window.matchMedia("(pointer: fine)").matches) {
          window.addEventListener("mousemove", move, { passive: true });
        }

        return () => {
          if (rafId) cancelAnimationFrame(rafId);
          window.removeEventListener("mousemove", move);
        };
      }, [mouseX, mouseY, mouseX2, mouseY2]);

      const glow1 = useTransform(
        [sx, sy],
        ([x, y]) => `radial-gradient(650px circle at ${x}px ${y}px, rgba(241, 171, 1, 0.24), transparent 65%)`
      );

      const glow2 = useTransform(
        [sx2, sy2],
        ([x, y]) => `radial-gradient(500px circle at ${x}px ${y}px, rgba(255, 255, 255, 0.06), transparent 60%)`
      );

      return (
        <div aria-hidden="true" style={{ position: "fixed", inset: 0, zIndex: -1, pointerEvents: "none", overflow: "hidden" }}>
          {/* Layer 1: Global Cursor-following Radial Light across ALL sections */}
          <motion.div
            style={{
              position: "absolute",
              inset: 0,
              background: glow1,
              willChange: "background",
            }}
          />
          <motion.div
            style={{
              position: "absolute",
              inset: 0,
              background: glow2,
              willChange: "background",
            }}
          />

          {/* Layer 2: Technical Developer Grid */}
          <div className="absolute inset-0 bg-grid-pattern opacity-60" />

          {/* Layer 3: Floating Ambient Particles */}
          <div className="absolute inset-0 overflow-hidden opacity-30">
            <div className="absolute top-[20%] left-[15%] w-1.5 h-1.5 rounded-full bg-neon animate-ping duration-1000" />
            <div className="absolute top-[60%] left-[80%] w-1 h-1 rounded-full bg-white animate-pulse" />
            <div className="absolute top-[75%] left-[25%] w-1.5 h-1.5 rounded-full bg-neon/80 animate-pulse" />
          </div>

          {/* Layer 4: Cinematic Noise Overlay */}
          <svg className="fixed inset-0 w-full h-full pointer-events-none opacity-[0.03] z-0 mix-blend-overlay">
            <filter id="noiseFilter">
              <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
            </filter>
            <rect width="100%" height="100%" filter="url(#noiseFilter)" />
          </svg>
        </div>
      );
    }

    /* ---------- Custom Interactive Cursor ---------- */
    function CustomCursor() {
      const [enabled, setEnabled] = React.useState(false);
      const [hovering, setHovering] = React.useState(false);
      const x = useMotionValue(-100);
      const y = useMotionValue(-100);
      const sx = useSpring(x, { stiffness: 1000, damping: 40, mass: 0.12 });
      const sy = useSpring(y, { stiffness: 1000, damping: 40, mass: 0.12 });
      const enabledRef = React.useRef(false);

      React.useEffect(() => {
        if (window.matchMedia("(pointer: coarse)").matches || "ontouchstart" in window) {
          return;
        }

        let rafId = null;
        const move = (e) => {
          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(() => {
            x.set(e.clientX);
            y.set(e.clientY);
            if (!enabledRef.current) {
              enabledRef.current = true;
              setEnabled(true);
              document.body.classList.add("has-custom-cursor");
            }
          });
        };

        const isInteractive = (el) => {
          if (!el || !el.closest) return false;
          return Boolean(el.closest("a, button, [role='button'], input, select, textarea, .btn-hard"));
        };

        const over = (e) => {
          if (isInteractive(e.target)) setHovering(true);
        };
        const out = (e) => {
          if (isInteractive(e.target)) setHovering(false);
        };

        window.addEventListener("mousemove", move, { passive: true });
        document.addEventListener("mouseover", over, { passive: true });
        document.addEventListener("mouseout", out, { passive: true });

        return () => {
          if (rafId) cancelAnimationFrame(rafId);
          window.removeEventListener("mousemove", move);
          document.removeEventListener("mouseover", over);
          document.removeEventListener("mouseout", out);
          document.body.classList.remove("has-custom-cursor");
        };
      }, [x, y]);

      if (!enabled) return null;

      return (
        <motion.div
          aria-hidden="true"
          style={{
            position: "fixed",
            top: 0,
            left: 0,
            x: sx,
            y: sy,
            zIndex: 9999,
            pointerEvents: "none",
            willChange: "transform",
          }}
        >
          <motion.div
            style={{ transform: "translate(-50%, -50%)", borderColor: "#f1ab01" }}
            animate={{
              opacity: enabled ? 1 : 0,
              width: hovering ? 46 : 16,
              height: hovering ? 46 : 16,
              backgroundColor: hovering ? "rgba(241,171,1,0)" : "#f1ab01",
              borderWidth: hovering ? 1.5 : 0,
            }}
            transition={{ duration: 0.2, ease: EASE }}
            className="rounded-full border"
          />
        </motion.div>
      );
    }

  </script>
